name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: musterwerk
          POSTGRES_PASSWORD: musterwerk
          POSTGRES_DB: musterwerk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U musterwerk -d musterwerk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://musterwerk:musterwerk@localhost:5432/musterwerk_test?schema=public
      TEST_DATABASE_URL: postgresql://musterwerk:musterwerk@localhost:5432/musterwerk_test?schema=public
      NODE_ENV: test
      WEB_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate:test
      - run: npm run test:integration
