name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: musterwerk
          POSTGRES_PASSWORD: musterwerk
          POSTGRES_DB: musterwerk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U musterwerk -d musterwerk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://musterwerk:musterwerk@localhost:5432/musterwerk_test?schema=public
      TEST_DATABASE_URL: postgresql://musterwerk:musterwerk@localhost:5432/musterwerk_test?schema=public
      NODE_ENV: test
      WEB_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate:test
      - run: npm run test:integration

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - quality
      - postgres-integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: facility-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
      CLOUDFRONT_DOMAIN: ${{ vars.CLOUDFRONT_DOMAIN }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_REGION AWS_ROLE_ARN AWS_INSTANCE_ID CLOUDFRONT_DOMAIN; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required repository variable: ${name}" >&2
              exit 1
            fi
          done
          if [[ "$CLOUDFRONT_DOMAIN" == *://* || "$CLOUDFRONT_DOMAIN" == */* ]]; then
            echo 'CLOUDFRONT_DOMAIN must be a hostname without a scheme or path.' >&2
            exit 1
          fi

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Build and push deployment images
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            --build-arg VITE_API_URL=/api \
            --tag "$ECR_REGISTRY/portfolio/facility-web:$IMAGE_TAG" \
            --tag "$ECR_REGISTRY/portfolio/facility-web:latest" \
            --file Dockerfile.web.aws \
            .

          docker build \
            --tag "$ECR_REGISTRY/portfolio/facility-api:$IMAGE_TAG" \
            --tag "$ECR_REGISTRY/portfolio/facility-api:latest" \
            --file Dockerfile.api \
            .

          docker build \
            --target migration \
            --tag "$ECR_REGISTRY/portfolio/facility-migrate:$IMAGE_TAG" \
            --tag "$ECR_REGISTRY/portfolio/facility-migrate:latest" \
            --file Dockerfile.api \
            .

          docker push "$ECR_REGISTRY/portfolio/facility-web:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/portfolio/facility-web:latest"
          docker push "$ECR_REGISTRY/portfolio/facility-api:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/portfolio/facility-api:latest"
          docker push "$ECR_REGISTRY/portfolio/facility-migrate:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/portfolio/facility-migrate:latest"

      - name: Deploy through AWS Systems Manager
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        shell: bash
        run: |
          set -euo pipefail

          parameters="$(
            jq -cn \
              --arg region "$AWS_REGION" \
              --arg registry "$ECR_REGISTRY" \
              --arg image_tag "$IMAGE_TAG" \
              '{
                commands: [
                  "set -euo pipefail",
                  "cd /opt/portfolio/facility",
                  ("aws ecr get-login-password --region " + ($region | @sh) + " | docker login --username AWS --password-stdin " + ($registry | @sh)),
                  ("printf \"%s\\n\" " + (("IMAGE_TAG=" + $image_tag) | @sh) + " > deploy.env"),
                  "chmod 600 deploy.env",
                  "docker compose --env-file deploy.env pull",
                  "docker compose --env-file deploy.env run --rm migrate",
                  "docker compose --env-file deploy.env up -d --remove-orphans api web",
                  "docker image prune -f"
                ],
                executionTimeout: ["900"]
              }'
          )"

          command_id="$(
            aws ssm send-command \
              --document-name AWS-RunShellScript \
              --instance-ids "$AWS_INSTANCE_ID" \
              --comment "Deploy facility $IMAGE_TAG" \
              --parameters "$parameters" \
              --timeout-seconds 900 \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "SSM command: $command_id"

          deadline=$((SECONDS + 960))
          invocation=''
          poll_failures=0
          while (( SECONDS < deadline )); do
            if invocation="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$AWS_INSTANCE_ID" \
                --output json 2>ssm-poll-error.log
            )"; then
              poll_failures=0
              status="$(jq -r '.Status' <<<"$invocation")"
              echo "SSM deployment status: $status"
              case "$status" in
                Success)
                  jq -r '.StandardOutputContent' <<<"$invocation"
                  exit 0
                  ;;
                Pending|InProgress|Delayed)
                  ;;
                *)
                  echo 'SSM deployment failed. Standard output:' >&2
                  jq -r '.StandardOutputContent' <<<"$invocation" >&2
                  echo 'SSM deployment failed. Standard error:' >&2
                  jq -r '.StandardErrorContent' <<<"$invocation" >&2
                  exit 1
                  ;;
              esac
            else
              poll_failures=$((poll_failures + 1))
              if (( poll_failures >= 12 )); then
                echo 'Unable to read the SSM command invocation:' >&2
                cat ssm-poll-error.log >&2
                exit 1
              fi
            fi
            sleep 5
          done

          echo 'Timed out waiting for the SSM deployment command.' >&2
          if [[ -n "$invocation" ]]; then
            echo 'Last standard output:' >&2
            jq -r '.StandardOutputContent' <<<"$invocation" >&2
            echo 'Last standard error:' >&2
            jq -r '.StandardErrorContent' <<<"$invocation" >&2
          fi
          exit 1

      - name: Verify public health endpoints
        shell: bash
        run: |
          set -euo pipefail
          health_url="https://$CLOUDFRONT_DOMAIN/health"
          ready_url="https://$CLOUDFRONT_DOMAIN/api/ready"

          health_response="$(
            curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              --retry 10 --retry-delay 10 --retry-all-errors \
              "$health_url"
          )"
          if [[ "$health_response" != 'ok' ]]; then
            echo "Unexpected response from $health_url: $health_response" >&2
            exit 1
          fi

          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 10 --retry-delay 10 --retry-all-errors \
            --output /dev/null \
            "$ready_url"
